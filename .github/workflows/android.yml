name: Android native build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_PLATFORM: android-29
  NDK_VERSION: 26.3.11579264
  CMAKE_VERSION: 3.22.1

jobs:
  build:
    name: Build Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
    env:
      ANDROID_ABI: ${{ matrix.abi }}
      BUILD_DIR: build/android-${{ matrix.abi }}-release

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "Android SDK path is not available" >&2
            exit 1
          fi

          sdkmanager --sdk_root="$sdk_root" --install \
            "platforms;${ANDROID_PLATFORM}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          ndk_home="$sdk_root/ndk/${NDK_VERSION}"
          cmake_bin="$sdk_root/cmake/${CMAKE_VERSION}/bin"
          test -d "$ndk_home"
          test -x "$cmake_bin/cmake"
          test "$(sed -n 's/^[[:space:]]*Pkg\.Revision[[:space:]]*=[[:space:]]*//p' "$ndk_home/source.properties" | head -n 1)" = "$NDK_VERSION"

          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_home" >> "$GITHUB_ENV"
          echo "$cmake_bin" >> "$GITHUB_PATH"

      - name: Verify build tools
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          ninja --version
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DNEXTDUMPER_ENABLE_THINLTO=ON \
            -DNEXTDUMPER_OPTIMIZE_FOR_SIZE=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --parallel "$(nproc)"

  release-build:
    name: Build release variants ${{ matrix.abi }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
    env:
      ANDROID_ABI: ${{ matrix.abi }}
      RELEASE_BUILD_DIR: build/android-${{ matrix.abi }}-release-artifact
      DEBUG_BUILD_DIR: build/android-${{ matrix.abi }}-debug-artifact

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdkmanager --sdk_root="$sdk_root" --install \
            "platforms;${ANDROID_PLATFORM}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          ndk_home="$sdk_root/ndk/${NDK_VERSION}"
          cmake_bin="$sdk_root/cmake/${CMAKE_VERSION}/bin"
          test -d "$ndk_home"
          test -x "$cmake_bin/cmake"
          test "$(sed -n 's/^[[:space:]]*Pkg\.Revision[[:space:]]*=[[:space:]]*//p' "$ndk_home/source.properties" | head -n 1)" = "$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_home" >> "$GITHUB_ENV"
          echo "$cmake_bin" >> "$GITHUB_PATH"
          echo "$ndk_home/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Configure release variant without NDEBUG
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$RELEASE_BUILD_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEXTDUMPER_ENABLE_THINLTO=ON \
            -DNEXTDUMPER_OPTIMIZE_FOR_SIZE=ON \
            -DNEXTDUMPER_DISABLE_NDEBUG=ON

      - name: Configure debug variant with NDEBUG
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$DEBUG_BUILD_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNEXTDUMPER_ENABLE_THINLTO=ON \
            -DNEXTDUMPER_FORCE_NDEBUG=ON

      - name: Build release variants
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RELEASE_BUILD_DIR" --parallel "$(nproc)"
          cmake --build "$DEBUG_BUILD_DIR" --parallel "$(nproc)"

      - name: Package release variants
        shell: bash
        run: |
          set -euo pipefail
          test -x "$RELEASE_BUILD_DIR/NextDumper"
          test -x "$DEBUG_BUILD_DIR/NextDumper"
          version="$GITHUB_REF_NAME"
          strip_tool="$(command -v llvm-strip)"

          for variant in release debug; do
            if [[ "$variant" == release ]]; then
              build_dir="$RELEASE_BUILD_DIR"
              package_suffix="release"
            else
              build_dir="$DEBUG_BUILD_DIR"
              package_suffix="debug"
            fi
            package_name="NextDumper-android-${ANDROID_ABI}-${package_suffix}-${version}"
            archive_name="${package_name}.tar.gz"
            mkdir -p "dist/$package_name"
            install -m 0755 "$build_dir/NextDumper" "dist/$package_name/NextDumper"
            if [[ "$variant" == release ]]; then
              "$strip_tool" --strip-unneeded "dist/$package_name/NextDumper"
            fi
            printf '%s\n' \
              'Project: NextDumper' \
              "Commit: $GITHUB_SHA" \
              "Ref: $GITHUB_REF" \
              "Target: Android $ANDROID_PLATFORM / $ANDROID_ABI" \
              "Variant: $variant" \
              "NDEBUG: $([[ "$variant" == release ]] && echo disabled || echo enabled)" \
              "NDK: $NDK_VERSION" \
              "CMake: $CMAKE_VERSION" \
              > "dist/$package_name/BUILD-METADATA.txt"
            (
              cd dist
              tar -czf "$archive_name" "$package_name"
              sha256sum "$archive_name" > "${archive_name}.sha256"
            )
          done

      - name: Upload release variants
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ matrix.abi }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          pattern: android-release-*-${{ github.sha }}
          merge-multiple: true
          path: dist

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "NextDumper $tag" \
              --generate-notes \
              --verify-tag
          fi
